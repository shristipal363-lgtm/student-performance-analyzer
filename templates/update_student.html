<!DOCTYPE html>
<html>

<head>
    <title>Update Student</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            text-align: center;
        }

        .navbar {
            background-color: #1f2937;
            padding: 20px;
        }

        .navbar h1 {
            color: white;
            margin: 0;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h2 {
            color: #2563eb;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 95%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="navbar">
        <h1>Student Performance Analyzer</h1>
    </div>

    <div class="container">

        <h2>Update Student</h2>

        <form method="POST">

            <label>Student ID:</label>
            <input type="number" name="id" required>

            <label>New Python Marks:</label>
            <input type="number"
                   name="python_marks"
                   min="0"
                   max="100"
                   required>

            <label>New DBMS Marks:</label>
            <input type="number"
                   name="dbms_marks"
                   min="0"
                   max="100"
                   required>

            <label>New Maths Marks:</label>
            <input type="number"
                   name="maths_marks"
                   min="0"
                   max="100"
                   required>

            <button type="submit">Update Student</button>

        </form>

        <a href="/" class="back">Back to Home</a>

    </div>

</body>

</html>
