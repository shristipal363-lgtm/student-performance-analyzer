<!DOCTYPE html>
<html>

<head>
    <title>Student Records</title>
</head>

<body>

    <h1>Student Records</h1>

    <table border="1" cellpadding="10">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Python</th>
            <th>DBMS</th>
            <th>Maths</th>
            <th>Total</th>
            <th>Percentage</th>
            <th>Grade</th>
        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>{{ student[4] }}</td>
            <td>{{ student[5] }}</td>
            <td>{{ student[6] }}</td>
            <td>{{ student[7] }}</td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/">Back to Home</a>

</body>

</html>
