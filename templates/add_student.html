<!DOCTYPE html>
<html>

<head>
    <title>Add Student</title>

    <style>

        body {
            font-family: Arial, sans-serif;

        }

            background-color: #1f2937;

        .navbar h1 {

        .container {

        }

            color: #2563eb;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 95%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

</head>

<body>

    <div class="navbar">
        <h1>Student Performance Analyzer</h1>
    </div>

    <div class="container">

        <h2>Add Student</h2>

        <form method="POST">

            <label>Student Name:</label>
            <input type="text" name="name" placeholder="Enter student name" required>

            <label>Python Marks:</label>
            <input type="number" name="python_marks" min="0" max="100" required>

            <label>DBMS Marks:</label>
            <input type="number" name="dbms_marks" min="0" max="100" required>

            <label>Maths Marks:</label>
            <input type="number" name="maths_marks" min="0" max="100" required>

            <button type="submit">Add Student</button>

        </form>

        <a href="/" class="back">Back to Home</a>

    </div>

</body>

</html>
