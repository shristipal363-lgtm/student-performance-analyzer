<!DOCTYPE html>
<html>

<head>
    <title>Student Statistics</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            text-align: center;
        }

        .navbar {
            background-color: #1f2937;
            padding: 20px;
        }

        .navbar h1 {
            color: white;
            margin: 0;
        }

        .container {
            width: 900px;
            max-width: 90%;
            margin: 50px auto;
        }

        h2 {
            color: #1f2937;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .card {
            background-color: white;
            width: 220px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        .card h3 {
            color: #2563eb;
        }

        .card p {
            font-size: 25px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 35px;
            padding: 12px 25px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

    </style>
</head>

<body>

    <div class="navbar">
        <h1>Student Performance Analyzer</h1>
    </div>

    <div class="container">

        <h2>Student Statistics</h2>

        <div class="cards">

            <div class="card">
                <h3>Average Python</h3>
                <p>{{ average_python }}</p>
            </div>

            <div class="card">
                <h3>Average DBMS</h3>
                <p>{{ average_dbms }}</p>
            </div>

            <div class="card">
                <h3>Average Maths</h3>
                <p>{{ average_maths }}</p>
            </div>

            <div class="card">
                <h3>Highest Percentage</h3>
                <p>{{ highest_percentage }}%</p>
            </div>

            <div class="card">
                <h3>Lowest Percentage</h3>
                <p>{{ lowest_percentage }}%</p>
            </div>

        </div>

        <a href="/" class="back">Back to Home</a>

    </div>

</body>

</html>
